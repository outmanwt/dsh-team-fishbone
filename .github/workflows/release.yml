name: Publish GitHub release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Check tag matches package version
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) process.exit(1)"
      - name: Pack installable bundle
        shell: bash
        run: |
          archive=$(npm pack --ignore-scripts --silent)
          mv "$archive" dsh-team-fishbone.tgz
          sha256sum dsh-team-fishbone.tgz > SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dsh-team-fishbone.tgz SHA256SUMS.txt --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
